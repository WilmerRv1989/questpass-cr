<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | QuestPass CR</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <a class="visually-hidden-focusable salto" href="#contenido">Saltar al contenido principal</a>

    <header>
        <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark" aria-label="Navegación principal">
            <div class="container">
                <a class="navbar-brand" href="index.html">QuestPass CR</a>

                <button class="navbar-toggler" type="button"
                        data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                        aria-controls="menuPrincipal" aria-expanded="false"
                        aria-label="Menú de navegación">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="experiencias.html">Experiencias</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="reservar.html">Reservar</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="contacto.html">Contacto</a>
                        </li>
                    </ul>
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="login.html">Iniciar sesión</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="admin.html">Administración</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main id="contenido" class="container" tabindex="-1">
        <h1 class="display-5">Iniciar sesión</h1>
        <p class="lead">Ingrese con su correo electrónico y contraseña.</p>

        <form class="formulario formulario-corto marco mx-auto p-md-4" method="post">
            <div class="row mb-3">
                <label for="correo" class="col-md-4 col-form-label text-md-end">Correo electrónico</label>
                <div class="col-md-8">
                    <input type="email" id="correo" name="correo" class="form-control"
                           required autocomplete="username">
                </div>
            </div>

            <div class="row mb-4">
                <label for="clave" class="col-md-4 col-form-label text-md-end">Contraseña</label>
                <div class="col-md-8">
                    <input type="password" id="clave" name="clave" class="form-control"
                           required autocomplete="current-password">
                </div>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary btn-lg">Iniciar sesión</button>
            </div>
        </form>
    </main>

    <footer class="pie">
        <div class="container">
            <p>&copy; 2026 QuestPass CR</p>
        </div>
    </footer>

    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
